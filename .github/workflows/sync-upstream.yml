name: Sincronizar Zigbee2MQTT oficial

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sincronizar todos os slots
        run: python3 scripts/maintain.py
      - name: Validar arquivos sincronizados
        run: python3 scripts/validate.py
      - name: Ler versão sincronizada
        id: version
        run: echo "value=$(jq -r .version tmh_zigbee2mqtt_01/config.json)" >> "$GITHUB_OUTPUT"
      - name: Publicar atualização oficial
        run: |
          if test -z "$(git status --porcelain -- tmh_zigbee2mqtt_*)"; then
            echo "Nenhuma atualização oficial encontrada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tmh_zigbee2mqtt_*
          git commit -m "chore: sincronizar Zigbee2MQTT ${{ steps.version.outputs.value }}"
          git push
