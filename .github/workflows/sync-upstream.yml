name: Sincronizar Zigbee2MQTT oficial

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sincronizar todos os slots
        run: python3 scripts/maintain.py
      - name: Ler versão sincronizada
        id: version
        run: echo "value=$(jq -r .version tmh_zigbee2mqtt_01/config.json)" >> "$GITHUB_OUTPUT"
      - name: Publicar atualização oficial
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: sincronizar Zigbee2MQTT ${{ steps.version.outputs.value }}"
