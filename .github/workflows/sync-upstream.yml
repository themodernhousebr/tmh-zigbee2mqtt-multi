name: Sincronizar Zigbee2MQTT oficial

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sincronizar todos os slots
        run: python3 scripts/maintain.py
      - name: Ler versão sincronizada
        id: version
        run: echo "value=$(jq -r .version tmh_zigbee2mqtt_01/config.json)" >> "$GITHUB_OUTPUT"
      - name: Abrir atualização para revisão
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/sync-zigbee2mqtt
          delete-branch: true
          commit-message: "chore: sincronizar Zigbee2MQTT ${{ steps.version.outputs.value }}"
          title: "Atualizar Zigbee2MQTT para ${{ steps.version.outputs.value }}"
          body: |
            Sincronização automática da App oficial estável.

            Antes de mesclar, revise o changelog e teste em uma instalação piloto.
          labels: upstream-update
