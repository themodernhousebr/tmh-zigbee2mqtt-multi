name: Gerar novos slots

on:
  push:
    branches: [main]
    paths:
      - slots.yaml
      - upstream.yaml
      - repository.yaml
      - scripts/maintain.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-slots
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Gerar e atualizar slots
        run: python3 scripts/maintain.py
      - name: Salvar arquivos gerados
        run: |
          if test -z "$(git status --porcelain -- tmh_zigbee2mqtt_*)"; then
            echo "Nenhum novo slot para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tmh_zigbee2mqtt_*
          git commit -m "chore: gerar slots definidos em slots.yaml"
          git push
